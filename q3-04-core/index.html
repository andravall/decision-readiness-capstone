<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decision Readiness Board · MVP Core Build (Q3.04)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f3f2ec;
  --bg-subtle: #eae8df;
  --surface: #ffffff;
  --surface-raised: #faf9f5;
  --surface-sunken: #f5f4ee;
  --ink: #141714;
  --ink-secondary: #484e46;
  --ink-muted: #6e756b;
  --line: #ddddd3;
  --line-strong: #c5c6b9;
  --accent: #1b44c8;
  --accent-hover: #14359e;
  --accent-soft: #eef2fd;
  --accent-border: #c5d3f8;
  --good-ink: #135c3b;
  --good-bg: #eaf6ef;
  --good-border: #b7dfc8;
  --warn-ink: #824b0a;
  --warn-bg: #fef6e4;
  --warn-border: #efd393;
  --neutral-ink: #4a5048;
  --neutral-bg: #f0f1eb;
  --neutral-border: #d2d5ca;
  --alert-ink: #992828;
  --alert-bg: #fdf0ee;
  --alert-border: #efc1bc;
  --sans: "Space Grotesk", sans-serif;
  --mono: "JetBrains Mono", monospace;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-card: 0 1px 2px rgba(20, 23, 20, 0.04), 0 8px 24px -12px rgba(20, 23, 20, 0.06);
  --shadow-focus: 0 0 0 3px rgba(27, 68, 200, 0.22);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(rgba(20, 23, 20, 0.035) 1px, transparent 0);
  background-size: 20px 20px;
  color: var(--ink);
  font: 14.5px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

button, select, textarea, input {
  font: inherit;
  color: inherit;
  touch-action: manipulation;
}

#decision-card-el,
#builder-slot {
  scroll-margin-top: 84px;
}

button {
  cursor: pointer;
}

/* Header */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(250, 249, 245, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.topbar-inner,
.workspace {
  max-width: 1240px;
  margin: 0 auto;
  padding-left: 36px;
  padding-right: 36px;
}

.topbar-inner {
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand-mark {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--ink);
  color: #fff;
  display: grid;
  place-items: center;
  flex: none;
}

.brand-text {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
}

.brand-title {
  font-weight: 650;
  font-size: 14.5px;
  letter-spacing: -0.02em;
}

.brand-badge {
  font: 11px/1 var(--mono);
  color: var(--good-ink);
  padding: 3px 7px;
  border-radius: 4px;
  background: var(--good-bg);
  border: 1px solid var(--good-border);
  font-weight: 600;
}

.topbar-controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.storage-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 11px/1 var(--mono);
  color: var(--ink-secondary);
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
}

.storage-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--good-ink);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 38px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 580;
  transition: background 0.15s var(--ease), border-color 0.15s var(--ease);
  white-space: nowrap;
}

.btn:hover {
  background: var(--surface-sunken);
  border-color: var(--ink-muted);
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 1px 2px rgba(27, 68, 200, 0.18);
}

.btn.primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.btn.danger-ghost {
  color: var(--alert-ink);
  border-color: var(--alert-border);
  background: var(--surface);
}

.btn.danger-ghost:hover {
  background: var(--alert-bg);
}

.btn-sm {
  min-height: 34px;
  padding: 6px 11px;
  font-size: 12px;
}

.workspace {
  padding-top: 24px;
  padding-bottom: 48px;
}

/* Proposal Switcher Bar */
.switcher-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}

.proposal-tabs {
  display: flex;
  align-items: center;
  gap: 7px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  max-width: 100%;
}

.proposal-tabs::-webkit-scrollbar {
  display: none;
}

.prop-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  min-height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  font-size: 12.5px;
  font-weight: 560;
  color: var(--ink-secondary);
  transition: all 0.15s var(--ease);
}

.prop-tab:hover {
  color: var(--ink);
  background: var(--surface-raised);
}

.prop-tab.is-active {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}

.prop-tab-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #9aa097;
  flex: none;
}

.prop-tab-dot.good { background: #25a56a; }
.prop-tab-dot.warn { background: #e09624; }
.prop-tab-dot.alert { background: #e05252; }

/* Live Toast */
.live-toast {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  margin-bottom: 18px;
  border-radius: var(--radius-md);
  border: 1px solid var(--accent-border);
  background: var(--accent-soft);
  color: #16328c;
  font-size: 13px;
}

.live-toast.tone-warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-ink); }
.live-toast.tone-good { background: var(--good-bg); border-color: var(--good-border); color: var(--good-ink); }
.live-toast.tone-alert { background: var(--alert-bg); border-color: var(--alert-border); color: var(--alert-ink); }

.live-toast-content {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  font-weight: 500;
}

.live-toast-content svg,
.callout-title svg {
  width: 15px;
  height: 15px;
  flex: none;
}

.live-toast-dismiss {
  background: transparent;
  border: 0;
  padding: 4px 8px;
  font-size: 11.5px;
  border-radius: 4px;
}

/* Creation Form / Onboarding Card */
.builder-shell {
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 3px solid var(--accent);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 28px 30px;
  margin-bottom: 22px;
}

.eyebrow {
  font: 11px/1.4 var(--mono);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin: 0 0 8px;
}

.builder-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.builder-head h1,
.builder-head h2 {
  font: 700 clamp(24px, 3vw, 32px)/1.15 var(--sans);
  letter-spacing: -0.03em;
  margin: 0 0 6px;
}

.builder-sub {
  margin: 0;
  font-size: 13.5px;
  color: var(--ink-secondary);
  max-width: 66ch;
}

.form-error-box {
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background: var(--alert-bg);
  border: 1px solid var(--alert-border);
  color: var(--alert-ink);
  font-size: 13px;
  margin-bottom: 18px;
}

.form-error-box strong {
  display: block;
  margin-bottom: 4px;
}

.form-error-box ul {
  margin: 0;
  padding-left: 18px;
}

.builder-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  gap: 26px;
  align-items: start;
}

.form-panel {
  background: var(--surface-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 18px 20px;
}

.form-panel-title {
  font-size: 14px;
  font-weight: 650;
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.field-row {
  margin-bottom: 13px;
}

.field-row:last-child {
  margin-bottom: 0;
}

.field-cols-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

label.field-label {
  display: block;
  font-size: 12px;
  font-weight: 620;
  color: var(--ink);
  margin-bottom: 5px;
}

.field-hint {
  display: block;
  font-size: 11.5px;
  color: var(--ink-muted);
  margin-top: 3px;
}

input[type="text"],
input[type="date"],
input[type="time"],
select,
textarea {
  display: block;
  width: 100%;
  min-height: 38px;
  padding: 8px 11px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  font-size: 13px;
  color: var(--ink);
}

textarea {
  min-height: 88px;
  resize: vertical;
  line-height: 1.5;
}

.roster-rows {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.roster-item {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) 128px 148px 34px;
  gap: 7px;
  align-items: center;
}

.btn-icon-remove {
  width: 34px;
  height: 38px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink-muted);
  font-size: 16px;
  line-height: 1;
  display: grid;
  place-items: center;
}

.btn-icon-remove:hover {
  background: var(--alert-bg);
  border-color: var(--alert-border);
  color: var(--alert-ink);
}

.builder-footer {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

/* Proposal Hero Card */
.hero-shell {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  margin-bottom: 18px;
}

.hero-main {
  padding: 24px 28px 20px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
}

.hero-title {
  font: 700 clamp(25px, 3.3vw, 36px)/1.12 var(--sans);
  letter-spacing: -0.032em;
  margin: 0 0 13px;
}

.meta-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
}

.meta-chip {
  display: inline-flex;
  align-items: center;
  gap: 5.5px;
  padding: 4.5px 9px;
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--ink-secondary);
  font-variant-numeric: tabular-nums;
}

.meta-chip.rule-chip {
  background: var(--accent-soft);
  border-color: var(--accent-border);
  color: #19389e;
  font-weight: 500;
}

.status-box {
  min-width: 252px;
  max-width: 310px;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  background: var(--surface-raised);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}

.status-box-label,
.diag-label {
  font: 10.5px/1.25 var(--mono);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.status-box-caption {
  font-size: 12px;
  line-height: 1.45;
  color: var(--ink-secondary);
  margin: 0;
}

/* Protocol Stepper Rail */
.protocol-rail {
  border-top: 1px solid var(--line);
  background: var(--surface-raised);
  padding: 11px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.protocol-steps {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.p-step {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--ink-muted);
  border: 1px solid transparent;
}

.p-step-num {
  font: 10.5px/1 var(--mono);
  padding: 2px 5px;
  border-radius: 3px;
  background: var(--bg-subtle);
  color: var(--ink-muted);
}

.p-step.is-active { background: var(--surface); border-color: var(--line-strong); color: var(--ink); font-weight: 600; }
.p-step.is-active .p-step-num { background: var(--ink); color: #fff; }
.p-step.is-active.tone-warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-ink); }
.p-step.is-active.tone-warn .p-step-num { background: var(--warn-ink); color: #fff; }
.p-step.is-active.tone-good { background: var(--good-bg); border-color: var(--good-border); color: var(--good-ink); }
.p-step.is-active.tone-good .p-step-num { background: var(--good-ink); color: #fff; }
.p-step.is-active.tone-alert { background: var(--alert-bg); border-color: var(--alert-border); color: var(--alert-ink); }
.p-step.is-active.tone-alert .p-step-num { background: var(--alert-ink); color: #fff; }
.p-step.is-done { color: var(--ink-secondary); }
.p-step.is-done .p-step-num { background: var(--good-bg); color: var(--good-ink); }

.p-arrow { color: var(--line-strong); font-size: 12px; }

.hero-quick-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Diagnostics */
.diagnostics {
  display: grid;
  grid-template-columns: 1.15fr 1.15fr 1fr;
  gap: 14px;
  margin-bottom: 22px;
}

.diag-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}

.diag-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.diag-metric {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 4px;
}

.diag-metric strong {
  font: 700 23px/1.1 var(--mono);
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
}

.diag-metric span {
  font-size: 13px;
  color: var(--ink-secondary);
}

.req-segments {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.req-seg {
  flex: 1 1 82px;
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface-sunken);
  font-size: 11.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  min-width: 0;
}

.req-seg-name {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.req-seg.seg-good { background: var(--good-bg); border-color: var(--good-border); color: var(--good-ink); }
.req-seg.seg-warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-ink); }
.req-seg.seg-neutral { background: var(--neutral-bg); border-color: var(--neutral-border); border-style: dashed; color: var(--neutral-ink); }
.req-seg.seg-alert { background: var(--alert-bg); border-color: var(--alert-border); color: var(--alert-ink); }

.blocker-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.blocker-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 550;
  background: var(--warn-bg);
  border: 1px solid var(--warn-border);
  color: var(--warn-ink);
}

.blocker-chip.is-alert { background: var(--alert-bg); border-color: var(--alert-border); color: var(--alert-ink); }

.diag-subtext {
  font-size: 12px;
  color: var(--ink-secondary);
  line-height: 1.45;
  margin: 0;
}

/* Main Grid */
.main-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.48fr) minmax(320px, 1fr);
  gap: 22px;
  align-items: start;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  min-width: 0;
}

.members-card { padding: 22px 24px; }

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.card-title { font-size: 17px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 4px; }
.card-subtitle { font-size: 12.5px; color: var(--ink-secondary); margin: 0; }

.role-group + .role-group { margin-top: 20px; }

.role-group-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  border: 1px solid var(--line);
  margin-bottom: 6px;
}

.role-group-title {
  font: 11px/1.2 var(--mono);
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.role-group-rule { font-size: 11.5px; color: var(--ink-muted); }

.member-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 14px;
  padding: 13px 10px;
  border-bottom: 1px solid var(--line);
  border-radius: var(--radius-sm);
}

.member-row:last-child { border-bottom: 0; }
.member-row.is-editing { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); border-bottom-color: transparent; }

.person-cell { display: flex; align-items: center; gap: 12px; min-width: 0; }

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font: 600 14px/1 var(--mono);
  background: var(--surface-sunken);
  border: 1px solid var(--line-strong);
  color: var(--ink-secondary);
  flex: none;
}

.avatar.is-required { background: #edf1fb; border-color: #c2cff5; color: #1c3d9c; }

.person-name-line { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.person-name { font-weight: 620; font-size: 14.5px; }

.role-tag {
  font: 10px/1 var(--mono);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 3px 6px;
  border-radius: 4px;
  font-weight: 600;
}
.role-tag.required { background: #eaeffd; color: #1b44c8; }
.role-tag.optional { background: var(--neutral-bg); color: var(--ink-muted); }

.drift-tag {
  font: 10px/1 var(--mono);
  padding: 3px 6px;
  border-radius: 4px;
  background: var(--alert-bg);
  border: 1px solid var(--alert-border);
  color: var(--alert-ink);
  font-weight: 600;
}

.person-meta { display: block; font-size: 12px; color: var(--ink-muted); margin-top: 3px; font-variant-numeric: tabular-nums; }

/* Add quick member inline box */
.inline-add-member {

<script>
const STORAGE_KEY = 'drb_q304_core_v1'
const $ = id => document.getElementById(id)

const RESPONSE_OPTIONS = [
  { value: 'Tersedia · pasti', tone: 'good', short: 'Pasti', desc: 'Menyatakan siap hadir dengan kepastian penuh pada waktu usulan.' },
  { value: 'Mungkin · tentatif', tone: 'warn', short: 'Tentatif', desc: 'Masih bersyarat atau belum dapat mengikat komitmen hadir.' },
  { value: 'Belum tahu', tone: 'warn', short: 'Belum tahu', desc: 'Sudah membalas pesan namun belum mengetahui kepastian jadwalnya.' },
  { value: 'Belum menjawab', tone: 'neutral', short: 'Belum balas', desc: 'Belum memberikan respons di ruang percakapan kelompok.' },
  { value: 'Tidak tersedia', tone: 'alert', short: 'Berhalangan', desc: 'Menyatakan tidak dapat hadir pada waktu yang diusulkan.' }
]

const STATUS_META = {
  'Usulan': { tone: 'neutral', caption: 'Usulan waktu aktif. Koordinator memeriksa kelengkapan respons sebelum bertindak.' },
  'Sementara': { tone: 'warn', caption: 'Menunggu konfirmasi anggota wajib. Jadwal belum dijanjikan sebagai keputusan final.' },
  'Final': { tone: 'good', caption: 'Jadwal telah ditegaskan secara sadar oleh koordinator beserta alasan tertulis.' },
  'Perlu tinjau ulang': { tone: 'alert', caption: 'Ada perubahan respons sesudah penetapan final. Periksa kembali kelayakan jadwal.' }
}

const esc = val => String(val ?? '').replace(/[&<>"']/g, ch => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[ch]))

function iconForTone(tone) {
  if (tone === 'good') {
    return '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.5"/><path d="M5.2 8.2l1.9 1.9 3.8-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  }
  if (tone === 'warn') {
    return '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.8v3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.1" r="0.9" fill="currentColor"/></svg>'
  }
  if (tone === 'alert') {
    return '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.2l6.2 11a.8.8 0 01-.7 1.2H2.5a.8.8 0 01-.7-1.2l6.2-11a.8.8 0 011.4 0z" stroke="currentColor" stroke-width="1.4"/><path d="M8 6.3v3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.7" r="0.85" fill="currentColor"/></svg>'
  }
  return '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.4 2.2"/></svg>'
}

function metaForResponse(response) {
  return RESPONSE_OPTIONS.find(o => o.value === response) || RESPONSE_OPTIONS[3]
}

function renderPill(label, tone = 'neutral', extra = '') {
  return '<span class="pill ' + tone + (extra ? ' ' + extra : '') + '">' + iconForTone(tone) + '<span>' + esc(label) + '</span></span>'
}

function nowTimeWIB() {
  try {
    const parts = new Intl.DateTimeFormat('id-ID', {
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Jakarta'
    }).format(new Date()).replace(':', '.')
    return parts + ' WIB'
  } catch (_) {
    const d = new Date()
    return String(d.getHours()).padStart(2, '0') + '.' + String(d.getMinutes()).padStart(2, '0') + ' WIB'
  }
}

function formatDateID(isoDate) {
  if (!isoDate || !/^\d{4}-\d{2}-\d{2}$/.test(isoDate)) return isoDate || '—'
  const [y, m, d] = isoDate.split('-').map(Number)
  const dt = new Date(Date.UTC(y, m - 1, d))
  return new Intl.DateTimeFormat('id-ID', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC'
  }).format(dt)
}

function formatHour(hhmm, tz) {
  if (!hhmm) return '—'
  return hhmm.replace(':', '.') + ' ' + (tz || 'WIB')
}

function uid(prefix = 'id') {
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7)
}

function loadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY)
    if (!raw) return { version: 1, activeId: null, proposals: [] }
    const parsed = JSON.parse(raw)
    if (!parsed || !Array.isArray(parsed.proposals)) return { version: 1, activeId: null, proposals: [] }
    return parsed
  } catch (_) {
    return { version: 1, activeId: null, proposals: [] }
  }
}

let store = loadStore()
let showCreateForm = store.proposals.length === 0
let screen = 'board' // 'board' | 'review' | 'followup' | 'announcement' | number (member idx)
let banner = null
let formErrors = []
let draftForm = createDefaultDraft()

function saveStore() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store))
  } catch (_) {}
}

function createDefaultDraft() {
  return {
    title: '',
    date: '2026-11-21',
    time: '19:30',
    tz: 'WIB',
    mode: 'Daring (Google Meet / Zoom)',
    members: [
      { name: '', required: true, response: 'Belum menjawab' },
      { name: '', required: true, response: 'Belum menjawab' },
      { name: '', required: false, response: 'Belum menjawab' }
    ]
  }
}

function createSampleDraft() {
  return {
    title: 'Sinkronisasi Backlog Sprint Kelompok',
    date: '2026-11-22',
    time: '20:00',
    tz: 'WIB',
    mode: 'Daring (Google Meet)',
    members: [
      { name: 'Nadia', required: true, response: 'Tersedia · pasti' },
      { name: 'Rafi', required: true, response: 'Belum menjawab' },
      { name: 'Salsa', required: true, response: 'Mungkin · tentatif' },
      { name: 'Tegar', required: false, response: 'Tidak tersedia' }
    ]
  }
}

function encodeSnapshot(proposal) {
  const json = JSON.stringify(proposal)
  const bytes = new TextEncoder().encode(json)
  let bin = ''
  bytes.forEach(b => { bin += String.fromCharCode(b) })
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
}

function decodeSnapshot(token) {
  const b64 = token.replace(/-/g, '+').replace(/_/g, '/')
  const bin = atob(b64)
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0))
  return JSON.parse(new TextDecoder().decode(bytes))
}

function tryImportFromHash() {
  const hash = window.location.hash || ''
  if (!hash.startsWith('#snapshot=')) return
  store = loadStore()
  try {
    const token = hash.slice('#snapshot='.length)
    const imported = decodeSnapshot(token)
    if (imported && imported.title && Array.isArray(imported.members) && imported.members.length >= 2) {
      const exists = store.proposals.find(p => p.id === imported.id)
      if (!exists) {
        imported.id = imported.id || uid('prop')
        store.proposals.unshift(imported)
      }
      store.activeId = imported.id
      showCreateForm = false
      screen = 'board'
      saveStore()
      banner = { text: 'Usulan "' + imported.title + '" dimuat dari tautan snapshot dan disimpan ke perangkat.', tone: 'good' }
      history.replaceState(null, '', window.location.pathname + window.location.search)
    }
  } catch (_) {
    banner = { text: 'Tautan snapshot tidak valid atau terpotong.', tone: 'alert' }
  }
}

function getActiveProposal() {
  if (!store.proposals.length) return null
  let found = store.proposals.find(p => p.id === store.activeId)
  if (!found) {
    found = store.proposals[0]
    store.activeId = found.id
    saveStore()
  }
  return found
}

function validateDraft(draft) {
  const errs = []
  const cleanTitle = (draft.title || '').trim()
  if (cleanTitle.length < 3) {
    errs.push('Judul pertemuan wajib diisi (minimal 3 karakter, bukan spasi kosong).')
  }
  if (!draft.date || !/^\d{4}-\d{2}-\d{2}$/.test(draft.date)) {
    errs.push('Tanggal pertemuan wajib dipilih secara lengkap.')
  }
  if (!draft.time || !/^\d{2}:\d{2}$/.test(draft.time)) {
    errs.push('Waktu pertemuan wajib diisi.')
  }

  const nonEmptyMembers = draft.members
    .map(m => ({
      name: (m.name || '').trim(),
      required: Boolean(m.required),
      response: RESPONSE_OPTIONS.some(o => o.value === m.response) ? m.response : 'Belum menjawab'
    }))
    .filter(m => m.name.length > 0)

  if (nonEmptyMembers.length < 2) {
    errs.push('Masukkan minimal 2 anggota kelompok dengan nama yang tidak kosong.')
  }

  const seen = new Set()
  const dupes = []
  for (const m of nonEmptyMembers) {
    const key = m.name.toLowerCase()
    if (seen.has(key)) dupes.push(m.name)
    seen.add(key)
  }
  if (dupes.length) {
    errs.push('Terdapat nama anggota ganda (' + dupes.join(', ') + '). Gunakan nama unik agar status tidak tertukar.')
  }

  if (nonEmptyMembers.length >= 2 && !nonEmptyMembers.some(m => m.required)) {
    errs.push('Tandai minimal 1 anggota sebagai Wajib hadir untuk mengevaluasi syarat kesiapan keputusan.')
  }

  return { errs, cleanTitle, nonEmptyMembers }
}

function syncDraftFromDOM() {
  const titleEl = $('f-title')
  if (!titleEl) return
  draftForm.title = titleEl.value
  draftForm.date = $('f-date').value
  draftForm.time = $('f-time').value
  draftForm.tz = $('f-tz').value
  draftForm.mode = $('f-mode').value
  const rows = document.querySelectorAll('[data-roster-row]')
  draftForm.members = [...rows].map(row => ({
    name: row.querySelector('[data-r-name]').value,
    required: row.querySelector('[data-r-role]').value === 'required',
    response: row.querySelector('[data-r-resp]').value
  }))
}

  $('btn-fill-sample').onclick = () => {

  if ($('btn-cancel-builder')) $('btn-cancel-builder').onclick = () => { showCreateForm = false; formErrors = []; render() }

  $('btn-add-roster-row').onclick = () => {
    syncDraftFromDOM()
    draftForm.members.push({ name: '', required: false, response: 'Belum menjawab' })
    render()
  }

  document.querySelectorAll('[data-remove-member]').forEach(btn => {
    btn.onclick = () => {
      syncDraftFromDOM()
      const idx = Number(btn.dataset.removeMember)
      if (draftForm.members.length > 2) {
        draftForm.members.splice(idx, 1)
      } else {
        draftForm.members[idx] = { name: '', required: idx === 0, response: 'Belum menjawab' }
      }
      render()
    }
  })

  $('create-proposal-form').onsubmit = event => {
    event.preventDefault()
    syncDraftFromDOM()
    const { errs, cleanTitle, nonEmptyMembers } = validateDraft(draftForm)
    if (errs.length > 0) {
      formErrors = errs
      render()
      if ($('form-error-box')) {
        $('form-error-box').tabIndex = -1
        $('form-error-box').focus()
      }
      return
    }

    const stamp = nowTimeWIB()
    const newProposal = {
      id: uid('prop'),
      title: cleanTitle,
      date: draftForm.date,
      time: draftForm.time,
      tz: draftForm.tz || 'WIB',
      mode: (draftForm.mode || '').trim() || 'Daring',
      status: 'Usulan',
      finalReason: '',
      finalAt: '',
      announcedAt: '',
      lastDriftInfo: '',
      updatedAt: stamp,
      members: nonEmptyMembers.map(m => ({
        id: uid('m'),
        name: m.name,
        required: m.required,
        response: m.response,
        time: m.response === 'Belum menjawab' ? '—' : stamp,
        driftedAfterFinal: false
      })),
      history: [
        {
          kind: 'Usulan',
          tone: 'accent',
          text: 'Usulan baru "' + cleanTitle + '" dibuat dengan ' + nonEmptyMembers.length + ' anggota (' + nonEmptyMembers.filter(x => x.required).length + ' wajib hadir)',
          at: stamp
        }
      ]
    }

    store.proposals.unshift(newProposal)
    store.activeId = newProposal.id
    saveStore()

    formErrors = []
    draftForm = createDefaultDraft()
    showCreateForm = false
    screen = 'board'
    banner = { text: 'Usulan "' + cleanTitle + '" berhasil disimpan dan dievaluasi.', tone: 'good' }
    render(true)
  }
}

function renderSwitcher(active) {
  if (!store.proposals.length) {
    $('switcher-slot').innerHTML = ''
    return
  }

  $('switcher-slot').innerHTML =
    '<nav class="switcher-bar" aria-label="Daftar usulan tersimpan">' +
      '<div class="proposal-tabs">' +
        store.proposals.map(p => {
          const dotTone = p.status === 'Final' ? 'good' : p.status === 'Sementara' ? 'warn' : p.status === 'Perlu tinjau ulang' ? 'alert' : ''
          return '<button type="button" class="prop-tab ' + (active && p.id === active.id ? 'is-active' : '') + '" data-select-prop="' + esc(p.id) + '">' +
            '<span class="prop-tab-dot ' + dotTone + '" aria-hidden="true"></span>' +
            '<span>' + esc(p.title) + '</span>' +
          '</button>'
        }).join('') +
      '</div>' +
      (active ? '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button type="button" class="btn btn-sm" id="btn-share-snapshot">Salin tautan snapshot</button>' +
        '<button type="button" class="btn btn-sm danger-ghost" id="btn-delete-active">Hapus usulan ini</button>' +
      '</div>' : '') +
    '</nav>'

  document.querySelectorAll('[data-select-prop]').forEach(btn => {
    btn.onclick = () => {
      store.activeId = btn.dataset.selectProp
      showCreateForm = false
      screen = 'board'
      saveStore()
      render(false)
    }
  })

  if ($('btn-share-snapshot') && active) {
    $('btn-share-snapshot').onclick = () => {
      const btn = $('btn-share-snapshot')
      const url = window.location.origin + window.location.pathname + '#snapshot=' + encodeSnapshot(active)
      const notify = () => {
        const prev = btn.textContent
        btn.textContent = 'Tautan snapshot disalin ✓'
        setTimeout(() => { if (btn) btn.textContent = prev }, 1800)
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(notify).catch(notify)
      } else {
        notify()
      }
    }
  }

  if ($('btn-delete-active') && active) {
    $('btn-delete-active').onclick = () => {
      const removedTitle = active.title
      store.proposals = store.proposals.filter(p => p.id !== active.id)
      store.activeId = store.proposals[0] ? store.proposals[0].id : null
      if (!store.proposals.length) showCreateForm = true
      screen = 'board'
      saveStore()
      banner = { text: 'Usulan "' + removedTitle + '" dihapus dari penyimpanan lokal.', tone: 'warn' }
      render(false)
    }
  }
}

function renderActiveWorkspace(proposal, focusPanel = false) {
  if (!proposal) {
    $('active-proposal-slot').innerHTML = ''
    $('mobile-dock').className = 'mobile-dock'
    $('mobile-dock').innerHTML = ''
    return
  }

  const indexed = proposal.members.map((member, index) => ({ member, index }))
  const requiredIndexed = indexed.filter(x => x.member.required)
  const optionalIndexed = indexed.filter(x => !x.member.required)
  const requiredMembers = requiredIndexed.map(x => x.member)
  const optionalMembers = optionalIndexed.map(x => x.member)
  const pendingRequired = requiredMembers.filter(m => m.response !== 'Tersedia · pasti')
  const readyCount = requiredMembers.length - pendingRequired.length
  const canFinalize = requiredMembers.length > 0 && pendingRequired.length === 0

  const sMeta = STATUS_META[proposal.status] || STATUS_META['Usulan']

  const steps = [
    { key: 'Usulan', num: '01', label: 'Usulan dibuka' },
    { key: 'Sementara', num: '02', label: 'Sementara · klarifikasi' },
    { key: 'Final', num: '03', label: 'Final · ditetapkan' }
  ]
  const railHtml = steps.map((step, idx) => {
    let cls = 'p-step'
    if (proposal.status === step.key) {
      const tone = step.key === 'Final' ? 'tone-good' : step.key === 'Sementara' ? 'tone-warn' : ''
      cls += ' is-active ' + tone
    } else if (
      (step.key === 'Usulan' && proposal.status !== 'Usulan') ||
      (step.key === 'Sementara' && (proposal.status === 'Final' || proposal.status === 'Perlu tinjau ulang') && proposal.history.some(h => h.kind === 'Protokol')) ||
      (step.key === 'Final' && proposal.status === 'Perlu tinjau ulang')
    ) {
      cls += ' is-done'
    }
    return '<span class="' + cls.trim() + '"><span class="p-step-num">' + step.num + '</span><span>' + step.label + '</span></span>' +
      (idx < steps.length - 1 ? '<span class="p-arrow" aria-hidden="true">→</span>' : '')
  }).join('') + (proposal.status === 'Perlu tinjau ulang'
    ? '<span class="p-arrow" aria-hidden="true">↺</span><span class="p-step is-active tone-alert"><span class="p-step-num">!</span><span>Perlu tinjau ulang</span></span>'
    : '')

  const segmentsHtml = requiredMembers.map(m => {
    const meta = metaForResponse(m.response)
    const sym = meta.tone === 'good' ? '✓' : meta.tone === 'alert' ? '✕' : meta.tone === 'warn' ? '◐' : '○'
    return '<div class="req-seg seg-' + meta.tone + '"><span class="req-seg-name">' + esc(m.name) + '</span><span aria-hidden="true">' + sym + '</span></div>'
  }).join('')

  const blockerHtml = canFinalize
    ? '<p class="diag-subtext" style="color:var(--good-ink);font-weight:550">Tidak ada penghalang anggota wajib. Menunggu peninjauan &amp; penetapan koordinator.</p>'
    : '<div class="blocker-chips">' + pendingRequired.map(m => {
        const meta = metaForResponse(m.response)
        return '<span class="blocker-chip ' + (meta.tone === 'alert' ? 'is-alert' : '') + '">' + esc(m.name) + ' · ' + esc(m.response) + '</span>'
      }).join('') + '</div>'

  const optSummary = optionalMembers.length
    ? optionalMembers.map(m => esc(m.name) + ' (' + esc(metaForResponse(m.response).short.toLowerCase()) + ')').join(', ')
    : 'Tidak ada anggota opsional pada usulan ini'

  function renderGroup(title, rule, list) {
    if (!list.length) return ''
    return '<div class="role-group">' +
      '<div class="role-group-bar"><span class="role-group-title">' + esc(title) + '</span><span class="role-group-rule">' + esc(rule) + '</span></div>' +
      '<div>' + list.map(({ member, index }) => {
        const meta = metaForResponse(member.response)
        const isEditing = screen === index
        return '<div class="member-row ' + (isEditing ? 'is-editing' : '') + '">' +
          '<div class="person-cell">' +
            '<span class="avatar ' + (member.required ? 'is-required' : '') + '" aria-hidden="true">' + esc(member.name[0].toUpperCase()) + '</span>' +
            '<div>' +
              '<div class="person-name-line">' +
                '<span class="person-name">' + esc(member.name) + '</span>' +
                '<span class="role-tag ' + (member.required ? 'required' : 'optional') + '">' + (member.required ? 'Wajib hadir' : 'Opsional') + '</span>' +
                (member.driftedAfterFinal ? '<span class="drift-tag">Berubah pasca-final</span>' : '') +
              '</div>' +
              '<span class="person-meta">' + esc(member.time === '—' ? 'Belum tercatat di board' : 'Diperbarui ' + member.time) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="member-status-cell">' + renderPill(member.response, meta.tone) + '</div>' +
          '<div><button type="button" class="btn btn-sm ' + (isEditing ? 'primary' : '') + '" data-edit-member="' + index + '" aria-label="Ubah respons ' + esc(member.name) + '">' + (isEditing ? 'Sedang diubah' : 'Ubah') + '</button></div>' +
        '</div>'
      }).join('') + '</div>' +
    '</div>'
  }

  // Right Panel HTML
  let panelInner = ''
  const panelActions = {}

  if (typeof screen === 'number' && proposal.members[screen]) {
    const member = proposal.members[screen]
    panelInner =
      '<div class="panel-eyebrow"><span>Pembaruan respons</span><span>' + (member.required ? 'Wajib hadir' : 'Opsional') + '</span></div>' +
      '<h2 id="panel-title">Ubah respons ' + esc(member.name) + '</h2>' +
      '<p class="panel-lead">Pilih status terbaru dari balasan WhatsApp. Perubahan langsung disimpan ke penyimpanan lokal.</p>' +
      '<form id="member-response-form">' +
        '<div class="radio-cards" role="radiogroup" aria-label="Status respons ' + esc(member.name) + '">' +
          RESPONSE_OPTIONS.map((opt, idx) => {
            const checked = opt.value === member.response
            return '<label class="radio-card ' + (checked ? 'is-selected' : '') + '">' +
              '<input type="radio" name="m-resp" value="' + esc(opt.value) + '"' + (checked ? ' checked' : '') + ' id="m-opt-' + idx + '">' +
              '<span class="radio-card-body">' +
                '<span class="radio-card-top"><span class="radio-card-title">' + esc(opt.value) + '</span>' + (checked ? '<span class="radio-card-current">Saat ini</span>' : '') + '</span>' +
                '<span class="radio-card-desc">' + esc(opt.desc) + '</span>' +
              '</span>' +
            '</label>'
          }).join('') +
        '</div>' +
        '<div class="field-row">' +
          '<label class="field-label" for="m-role-select">Peran kehadiran pada pertemuan ini</label>' +
          '<select id="m-role-select">' +
            '<option value="required"' + (member.required ? ' selected' : '') + '>Wajib hadir (penentu syarat final)</option>' +
            '<option value="optional"' + (!member.required ? ' selected' : '') + '>Opsional (konteks tambahan)</option>' +
          '</select>' +
        '</div>' +
        '<div class="actions">' +
          '<button type="submit" class="btn primary">Simpan pembaruan</button>' +
          '<button type="button" class="btn" id="p-cancel">Batal</button>' +
        '</div>' +
      '</form>'
    panelActions['p-cancel'] = () => { screen = 'board'; render(true) }
  } else if (screen === 'review') {
    const optCtx = optionalMembers.length
      ? optionalMembers.map(m => m.name + ': ' + m.response).join('; ')
      : 'Tanpa anggota opsional'
    panelInner =
      '<div class="panel-eyebrow"><span>Pemeriksaan kesiapan</span><span>Confirmation Protocol</span></div>' +
      '<h2 id="panel-title">Tinjau keputusan</h2>' +
      '<p class="panel-lead">Evaluasi otomatis syarat kehadiran anggota wajib pada usulan ini:</p>' +
      '<ul class="rule-checklist">' +
        '<li><span>Seluruh anggota wajib (<strong>' + requiredMembers.length + ' orang</strong>) menyatakan Tersedia · pasti</span><span class="rule-status ' + (canFinalize ? 'pass' : 'wait') + '">' + (canFinalize ? 'Terpenuhi (' + readyCount + '/' + requiredMembers.length + ')' : 'Belum (' + readyCount + '/' + requiredMembers.length + ')') + '</span></li>' +
        '<li><span>Konteks anggota opsional (' + esc(optCtx) + ')</span><span class="rule-status info">Tercatat</span></li>' +
        '<li><span>Alasan keputusan ditulis sadar oleh koordinator</span><span class="rule-status ' + (canFinalize ? 'info' : 'wait') + '">' + (canFinalize ? 'Wajib diisi' : 'Terkunci') + '</span></li>' +
      '</ul>' +
      (canFinalize
        ? '<div class="callout good"><div class="callout-title">' + iconForTone('good') + '<span>Syarat wajib hadir terpenuhi</span></div>Seluruh anggota wajib sudah menyatakan pasti hadir. Tuliskan alasan keputusan sebelum mengunci jadwal menjadi Final.</div>' +
          '<form id="finalize-form" novalidate>' +
            '<label class="field-label" for="final-reason-input">Alasan menetapkan jadwal final</label>' +
            '<textarea id="final-reason-input" required placeholder="Contoh: Seluruh anggota wajib hadir sudah memastikan tersedia pada waktu ini.">' + (proposal.status === 'Perlu tinjau ulang' && proposal.finalReason ? esc(proposal.finalReason) : '') + '</textarea>' +
            '<div class="actions">' +
              '<button type="submit" class="btn primary">Tetapkan jadwal final</button>' +
              '<button type="button" class="btn" id="p-back">Kembali</button>' +
            '</div>' +
          '</form>'
        : '<div class="callout warn"><div class="callout-title">' + iconForTone('warn') + '<span>Penetapan Final masih terkunci</span></div>Anggota wajib yang masih perlu dikonfirmasi:<ul>' +
            pendingRequired.map(m => '<li><strong>' + esc(m.name) + '</strong> — ' + esc(m.response) + '</li>').join('') +
          '</ul></div>' +
          '<div class="actions">' +
            '<button type="button" class="btn primary" id="p-mark-temp">Tandai sementara &amp; buat draf WA</button>' +
            '<button type="button" class="btn" id="p-back">Kembali</button>' +
          '</div>')
    panelActions['p-back'] = () => { screen = 'board'; render(true) }
    panelActions['p-mark-temp'] = () => {
      const at = nowTimeWIB()
      const names = pendingRequired.map(m => m.name).join(', ')
      proposal.status = 'Sementara'
      proposal.updatedAt = at
      proposal.members.forEach(m => { m.driftedAfterFinal = false })
      proposal.history.unshift({ kind: 'Protokol', tone: 'warn', text: 'Status Sementara ditetapkan · menunggu klarifikasi ' + names, at })

      banner = { text: 'Status usulan disimpan sebagai Sementara (' + at + ').', tone: 'warn' }

  } else if (screen === 'followup') {
    const names = pendingRequired.length ? pendingRequired.map(m => m.name).join(' dan ') : 'teman-teman'
    const waText =
      '[JADWAL SEMENTARA · PERLU KONFIRMASI]\n' +
      proposal.title + '\n' +
      formatDateID(proposal.date) + ' · ' + formatHour(proposal.time, proposal.tz) + ' · ' + proposal.mode + '\n\n' +
      'Halo ' + names + ', apakah sudah pasti bisa hadir pada waktu di atas? Saat ini jadwal masih berstatus sementara menunggu kepastian kalian.'

    panelInner =
      '<div class="panel-eyebrow"><span>Tindak lanjut WhatsApp</span><span>Status: Sementara</span></div>' +
      '<h2 id="panel-title">Draf klarifikasi WhatsApp</h2>' +
      '<p class="panel-lead">Pesan disusun otomatis dari data usulan aktif untuk disalin ke grup atau chat pribadi.</p>' +
      '<div class="wa-preview"><div class="wa-preview-bar"><span>Pesan klarifikasi</span><span>Siap salin</span></div><pre id="wa-draft-box">' + esc(waText) + '</pre></div>' +

        '<button type="button" class="btn" id="p-copy-wa">Salin teks pesan</button>' +
      '</div>'
    panelActions['p-back-board'] = () => { screen = 'board'; render(true) }
    panelActions['p-copy-wa'] = () => {
      const b = $('p-copy-wa')
      const ok = () => { const prev = b.textContent; b.textContent = 'Tersalin ✓'; setTimeout(() => { if (b) b.textContent = prev }, 1600) }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(waText).then(ok).catch(ok)
      else ok()
    }
  } else if (screen === 'announcement') {
    const waFinal =
      '[JADWAL FINAL DITETAPKAN]\n' +
      proposal.title + '\n' +
      formatDateID(proposal.date) + ' · ' + formatHour(proposal.time, proposal.tz) + ' · ' + proposal.mode + '\n\n' +
      'Dasar keputusan: ' + proposal.finalReason

    panelInner =
      '<div class="panel-eyebrow"><span>Pengumuman kelompok</span><span>Status: Final</span></div>' +
      '<h2 id="panel-title">Draf pengumuman jadwal</h2>' +
      '<p class="panel-lead">Bagikan pengumuman jadwal final beserta alasan keputusannya ke WhatsApp kelompok.</p>' +
      '<div class="wa-preview"><div class="wa-preview-bar"><span>Pesan pengumuman final</span><span>Siap salin</span></div><pre id="wa-final-box">' + esc(waFinal) + '</pre></div>' +
      (proposal.announcedAt ? '<p class="diag-subtext" style="color:var(--good-ink);font-weight:550">Tercatat sudah diumumkan pada ' + esc(proposal.announcedAt) + '.</p>' : '') +
      '<div class="actions">' +
        '<button type="button" class="btn primary" id="p-mark-ann">' + (proposal.announcedAt ? 'Catat ulang pengumuman' : 'Tandai sudah diumumkan') + '</button>' +
        '<button type="button" class="btn" id="p-copy-final">Salin teks</button>' +
        '<button type="button" class="btn" id="p-back">Kembali</button>' +
      '</div>'
    panelActions['p-mark-ann'] = () => {
      const at = nowTimeWIB()
      proposal.announcedAt = at
      proposal.updatedAt = at
      proposal.history.unshift({ kind: 'Pengumuman', tone: 'good', text: 'Pengumuman jadwal final dicatat oleh koordinator', at })
      saveStore()
      banner = { text: 'Status pengumuman jadwal dicatat (' + at + ').', tone: 'good' }
      screen = 'board'
      render(true)
    }
    panelActions['p-copy-final'] = () => {
      const b = $('p-copy-final')
      const ok = () => { const prev = b.textContent; b.textContent = 'Tersalin ✓'; setTimeout(() => { if (b) b.textContent = prev }, 1600) }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(waFinal).then(ok).catch(ok)
      else ok()
    }
    panelActions['p-back'] = () => { screen = 'board'; render(true) }
  } else {
    if (proposal.status === 'Final') {
      panelInner =
        '<div class="panel-eyebrow"><span>Keputusan koordinator</span><span>Ditetapkan ' + esc(proposal.finalAt) + '</span></div>' +
        '<h2 id="panel-title">Jadwal ditetapkan</h2>' +
        '<div class="callout good"><div class="callout-title">' + iconForTone('good') + '<span>Alasan penetapan final</span></div>' + esc(proposal.finalReason) + '</div>' +
        '<p class="diag-subtext">' + (proposal.announcedAt ? 'Sudah ditandai diumumkan pada ' + esc(proposal.announcedAt) + '.' : 'Jadwal terkunci sebagai Final dan siap diumumkan ke grup.') + '</p>' +
        '<div class="actions">' +
          '<button type="button" class="btn primary" id="p-open-ann">Buka draf pengumuman</button>' +
          '<button type="button" class="btn" id="p-open-rev">Periksa aturan</button>' +
        '</div>'
      panelActions['p-open-ann'] = () => { screen = 'announcement'; render(true) }
      panelActions['p-open-rev'] = () => { screen = 'review'; render(true) }
    } else if (proposal.status === 'Perlu tinjau ulang') {
      const det = pendingRequired.length
        ? 'Anggota wajib yang kembali menghalangi jadwal final: ' + pendingRequired.map(m => m.name + ' (' + m.response + ')').join(', ') + '.'
        : 'Seluruh anggota wajib masih pasti, namun perubahan pasca-final perlu ditinjau ulang koordinator.'
      panelInner =
        '<div class="panel-eyebrow"><span>Peringatan kemutakhiran</span><span>Pasca-final</span></div>' +
        '<h2 id="panel-title">Respons berubah setelah final</h2>' +
        '<div class="callout alert"><div class="callout-title">' + iconForTone('alert') + '<span>Keputusan lama perlu diperiksa kembali</span></div>' +
          (proposal.lastDriftInfo ? '<div style="margin-bottom:6px;font-weight:550">Perubahan: ' + esc(proposal.lastDriftInfo) + '</div>' : '') +
          esc(det) +
        '</div>' +
        '<div class="actions"><button type="button" class="btn primary" id="p-open-rev">Tinjau keputusan ulang</button></div>'
      panelActions['p-open-rev'] = () => { screen = 'review'; render(true) }
    } else if (canFinalize) {
      panelInner =
        '<div class="panel-eyebrow"><span>Keputusan koordinator</span><span>' + readyCount + '/' + requiredMembers.length + ' wajib pasti</span></div>' +
        '<h2 id="panel-title">Siap untuk ditinjau</h2>' +
        '<div class="callout good"><div class="callout-title">' + iconForTone('good') + '<span>Seluruh anggota wajib sudah pasti</span></div>Keputusan final tidak terjadi otomatis. Tinjau kesiapan dan tuliskan alasan untuk menetapkan jadwal final.</div>' +
        '<div class="actions"><button type="button" class="btn primary" id="p-open-rev">Tinjau &amp; tetapkan final</button></div>'
      panelActions['p-open-rev'] = () => { screen = 'review'; render(true) }
    } else {
      const names = pendingRequired.map(m => m.name).join(', ')
      panelInner =
        '<div class="panel-eyebrow"><span>Keputusan koordinator</span><span>' + (proposal.status === 'Sementara' ? 'Menunggu balasan WA' : 'Pemeriksaan awal') + '</span></div>' +
        '<h2 id="panel-title">' + (proposal.status === 'Sementara' ? 'Menunggu konfirmasi wajib' : 'Siapa yang perlu dikonfirmasi?') + '</h2>' +
        '<div class="callout warn"><div class="callout-title">' + iconForTone('warn') + '<span>Perlu ditindaklanjuti: ' + esc(names) + '</span></div>' +
          (proposal.status === 'Sementara'
            ? 'Usulan berstatus Sementara. Perbarui status anggota ketika balasan baru masuk di WhatsApp.'
            : 'Terdapat ' + pendingRequired.length + ' anggota wajib yang belum menyatakan tersedia pasti.') +
        '</div>' +
        '<div class="actions">' +
          '<button type="button" class="btn primary" id="p-open-rev">Tinjau keputusan</button>' +
          (proposal.status === 'Sementara' ? '<button type="button" class="btn" id="p-open-wa">Lihat draf klarifikasi WA</button>' : '') +
        '</div>'
      panelActions['p-open-rev'] = () => { screen = 'review'; render(true) }
      if (proposal.status === 'Sementara') panelActions['p-open-wa'] = () => { screen = 'followup'; render(true) }
    }
  }

  const prevReasonHtml = (proposal.status === 'Perlu tinjau ulang' && proposal.finalReason)
    ? '<div class="previous-reason-box"><strong>Alasan final sebelumnya (' + esc(proposal.finalAt) + '):</strong><br>' + esc(proposal.finalReason) + '</div>'
    : ''

  const panelStateClass = proposal.status === 'Final' ? 'state-good' : proposal.status === 'Sementara' ? 'state-warn' : proposal.status === 'Perlu tinjau ulang' ? 'state-alert' : ''

  $('active-proposal-slot').innerHTML =
    '<section class="hero-shell" aria-labelledby="active-title">' +
      '<div class="hero-main">' +
        '<div>' +
          '<p class="eyebrow">Usulan jadwal tersimpan · Diperbarui ' + esc(proposal.updatedAt) + '</p>' +
          '<h1 class="hero-title" id="active-title">' + esc(proposal.title) + '</h1>' +
          '<div class="meta-strip">' +
            '<span class="meta-chip">' + esc(formatDateID(proposal.date)) + '</span>' +
            '<span class="meta-chip">' + esc(formatHour(proposal.time, proposal.tz)) + '</span>' +
            '<span class="meta-chip">' + esc(proposal.mode) + '</span>' +
            '<span class="meta-chip rule-chip">Syarat: ' + requiredMembers.length + '/' + requiredMembers.length + ' wajib hadir harus pasti</span>' +
          '</div>' +
        '</div>' +
        '<div class="status-box">' +
          '<div><span class="status-box-label">Status keputusan</span><div style="margin-top:6px">' + renderPill(proposal.status, sMeta.tone, 'status-lg') + '</div></div>' +
          '<p class="status-box-caption">' + esc(sMeta.caption) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="protocol-rail"><div class="protocol-steps">' + railHtml + '</div><span class="diag-label">Data persisten localStorage</span></div>' +
    '</section>' +

    '<section class="diagnostics" aria-label="Diagnostik kesiapan">' +
      '<div class="diag-card">' +
        '<div><div class="diag-head"><span class="diag-label">Kesiapan wajib hadir</span><span class="diag-label">Syarat ' + requiredMembers.length + '/' + requiredMembers.length + '</span></div>' +
        '<div class="diag-metric"><strong id="metric-ready-ratio">' + readyCount + ' / ' + requiredMembers.length + '</strong><span>anggota wajib sudah pasti</span></div></div>' +
        '<div class="req-segments">' + segmentsHtml + '</div>' +
      '</div>' +
      '<div class="diag-card">' +
        '<div><div class="diag-head"><span class="diag-label">Penghalang keputusan</span><span class="diag-label">' + (canFinalize ? '0 tertunda' : pendingRequired.length + ' belum pasti') + '</span></div>' +
        '<div class="diag-metric"><strong>' + (canFinalize ? 'Siap tinjau' : pendingRequired.length + ' orang') + '</strong><span>' + (canFinalize ? 'syarat hadir terpenuhi' : 'menghalangi status final') + '</span></div></div>' +
        blockerHtml +
      '</div>' +
      '<div class="diag-card">' +
        '<div><div class="diag-head"><span class="diag-label">Anggota opsional</span><span class="diag-label">Total ' + proposal.members.length + ' anggota</span></div>' +
        '<div class="diag-metric"><strong>' + optionalMembers.length + ' opsional</strong><span>tidak menghalangi aturan</span></div></div>' +
        '<p class="diag-subtext">' + optSummary + '.</p>' +
      '</div>' +
    '</section>' +

    '<div class="main-grid">' +
      '<section class="card members-card" aria-labelledby="m-list-title">' +
        '<div class="card-header">' +
          '<div><h2 class="card-title" id="m-list-title">Respons anggota</h2><p class="card-subtitle">Klik Ubah pada baris anggota untuk mencatat jawaban terbaru dari WhatsApp.</p></div>' +
          '<span class="diag-label">' + String(proposal.members.length).padStart(2, '0') + ' anggota</span>' +
        '</div>' +
        renderGroup('Anggota wajib hadir · ' + String(requiredMembers.length).padStart(2, '0'), 'Seluruhnya harus tersedia pasti sebelum final', requiredIndexed) +
        renderGroup('Anggota opsional · ' + String(optionalMembers.length).padStart(2, '0'), 'Tetap tercatat, tidak menghalangi penetapan final', optionalIndexed) +
        '<form class="inline-add-member" id="inline-add-member-form">' +
          '<input type="text" id="inline-member-name" placeholder="Tambah anggota susulan..." aria-label="Nama anggota susulan">' +
          '<select id="inline-member-role" aria-label="Peran anggota susulan"><option value="required">Wajib hadir</option><option value="optional" selected>Opsional</option></select>' +
          '<button type="submit" class="btn btn-sm">+ Tambah</button>' +
        '</form>' +
      '</section>' +

      '<div class="side-stack">' +
        '<section class="card decision-card ' + panelStateClass + '" id="decision-card-el" aria-label="Panel keputusan koordinator">' + panelInner + prevReasonHtml + '</section>' +
        '<section class="card history-card" aria-labelledby="h-title">' +
          '<div class="history-head"><h2 id="h-title">Jejak perubahan</h2><span class="diag-label">' + proposal.history.length + ' catatan</span></div>' +
          '<ol class="history-list">' + proposal.history.map(item =>
            '<li class="history-item"><span class="history-dot ' + item.tone + '" aria-hidden="true"></span>' +
            '<div class="history-meta"><time>' + esc(item.at) + '</time><span class="history-kind">' + esc(item.kind) + '</span></div>' +
            '<div>' + esc(item.text) + '</div></li>'
          ).join('') + '</ol>' +
        '</section>' +
      '</div>' +
    '</div>'

  // Wire member edit buttons
  document.querySelectorAll('[data-edit-member]').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.editMember)
      screen = screen === idx ? 'board' : idx
      render(true)
    }
  })

  // Wire inline add member
  $('inline-add-member-form').onsubmit = event => {
    event.preventDefault()
    const rawName = $('inline-member-name').value.trim()
    const roleReq = $('inline-member-role').value === 'required'
    if (!rawName) {
      banner = { text: 'Masukkan nama anggota sebelum menambahkan ke daftar.', tone: 'alert' }
      render(false)
      return
    }
    if (proposal.members.some(m => m.name.toLowerCase() === rawName.toLowerCase())) {
      banner = { text: 'Anggota bernama "' + rawName + '" sudah terdaftar pada usulan ini.', tone: 'alert' }
      render(false)
      return
    }
    const at = nowTimeWIB()
    proposal.members.push({ id: uid('m'), name: rawName, required: roleReq, response: 'Belum menjawab', time: '—', driftedAfterFinal: false })
    proposal.updatedAt = at
    proposal.history.unshift({ kind: 'Anggota', tone: 'accent', text: rawName + ' ditambahkan sebagai ' + (roleReq ? 'anggota wajib hadir' : 'anggota opsional'), at })
    if (proposal.status === 'Final' && roleReq) {
      proposal.status = 'Perlu tinjau ulang'
      proposal.lastDriftInfo = rawName + ' baru ditambahkan sebagai Wajib hadir (' + at + ')'
      proposal.history.unshift({ kind: 'Tinjau ulang', tone: 'alert', text: 'Status beralih ke Perlu tinjau ulang karena penambahan anggota wajib pasca-final', at })
    }
    saveStore()
    banner = { text: 'Anggota "' + rawName + '" berhasil ditambahkan dan disimpan.', tone: 'good' }
    render(false)
  }

  Object.entries(panelActions).forEach(([id, fn]) => { if ($(id)) $(id).onclick = fn })

  const mForm = $('member-response-form')
  if (mForm) {
    mForm.querySelectorAll('input[name="m-resp"]').forEach(r => {
      r.onchange = () => {
        mForm.querySelectorAll('.radio-card').forEach(c => c.classList.remove('is-selected'))
        if (r.closest('.radio-card')) r.closest('.radio-card').classList.add('is-selected')
      }
    })
    mForm.onsubmit = event => {
      event.preventDefault()
      const member = proposal.members[screen]
      const chosen = mForm.querySelector('input[name="m-resp"]:checked')
      const nextResp = chosen ? chosen.value : member.response
      const nextReq = $('m-role-select').value === 'required'

      if (!nextReq && proposal.members.filter((m, i) => i === screen ? nextReq : m.required).length === 0) {
        banner = { text: 'Tidak dapat mengubah peran: minimal harus ada 1 anggota Wajib hadir pada usulan.', tone: 'alert' }
        render(false)
        return
      }

      const respChanged = member.response !== nextResp
      const roleChanged = member.required !== nextReq

      if (respChanged || roleChanged) {
        const at = nowTimeWIB()
        const prevResp = member.response
        member.response = nextResp
        member.required = nextReq
        member.time = at
        proposal.updatedAt = at

        const descParts = []
        if (respChanged) descParts.push(prevResp + ' → ' + nextResp)
        if (roleChanged) descParts.push('peran menjadi ' + (nextReq ? 'Wajib hadir' : 'Opsional'))

        proposal.history.unshift({
          kind: 'Respons',
          tone: metaForResponse(nextResp).tone === 'good' ? 'good' : metaForResponse(nextResp).tone === 'alert' ? 'alert' : 'accent',
          text: member.name + ' · ' + descParts.join(', '),
          at
        })

        if (proposal.status === 'Final') {
          proposal.status = 'Perlu tinjau ulang'
          member.driftedAfterFinal = true
          proposal.lastDriftInfo = member.name + ' (' + descParts.join(', ') + ' pada ' + at + ')'
          proposal.history.unshift({
            kind: 'Tinjau ulang',
            tone: 'alert',
            text: 'Status beralih ke Perlu tinjau ulang · data ' + member.name + ' berubah pasca-final',
            at
          })
          banner = { text: 'Perubahan pasca-final pada ' + member.name + ' tersimpan. Status beralih ke Perlu tinjau ulang.', tone: 'alert' }
        } else {
          banner = { text: 'Pembaruan ' + member.name + ' berhasil disimpan (' + at + ').', tone: 'good' }
        }
        saveStore()
      }
      screen = 'board'
      render(true)
    }
  }

  const fForm = $('finalize-form')
  if (fForm) {
    const rIn = $('final-reason-input')
    rIn.oninput = e => e.target.setCustomValidity('')
    fForm.onsubmit = event => {
      event.preventDefault()
      const trimmed = rIn.value.trim()
      if (!trimmed) {
        rIn.setCustomValidity('Isi alasan keputusan sebelum menetapkan jadwal final.')
        rIn.reportValidity()
        return
      }
      const at = nowTimeWIB()
      proposal.status = 'Final'
      proposal.finalReason = trimmed
      proposal.finalAt = at
      proposal.announcedAt = ''
      proposal.lastDriftInfo = ''
      proposal.updatedAt = at
      proposal.members.forEach(m => { m.driftedAfterFinal = false })
      proposal.history.unshift({ kind: 'Keputusan', tone: 'good', text: 'Final ditetapkan · ' + trimmed, at })
      saveStore()
      banner = { text: 'Jadwal ditetapkan sebagai Final dan tersimpan persisten (' + at + ').', tone: 'good' }
      screen = 'board'
      render(true)
    }
  }

  if (focusPanel && $('panel-title')) {
    $('panel-title').tabIndex = -1
    $('panel-title').focus({ preventScroll: true })
    if (window.innerWidth <= 980 && $('decision-card-el')) {
      $('decision-card-el').scrollIntoView({ behavior: 'smooth', block: 'start' })
    }
  }

  $('mobile-dock').className = 'mobile-dock has-proposal'
  const dockCta = typeof screen === 'number'
    ? 'Ke form respons ↓'
    : proposal.status === 'Final'
      ? 'Pengumuman ↓'
      : 'Panel keputusan ↓'
  $('mobile-dock').innerHTML =
    '<div class="mobile-dock-info">' +
      '<span class="mobile-dock-ratio">' + readyCount + '/' + requiredMembers.length + ' wajib pasti · ' + esc(proposal.status) + '</span>' +
      '<span class="mobile-dock-sub">' + esc(proposal.title) + '</span>' +
    '</div>' +
    '<button type="button" class="btn primary btn-sm" id="mobile-jump-decision">' + dockCta + '</button>'
  $('mobile-jump-decision').onclick = () => {
    if ($('decision-card-el')) $('decision-card-el').scrollIntoView({ behavior: 'smooth', block: 'start' })
  }
}

function render(focusPanel = false) {
  $('storage-count').textContent = 'Tersimpan lokal (' + store.proposals.length + ' usulan)'
  $('btn-clear-all').style.display = store.proposals.length > 0 ? 'inline-flex' : 'none'

  if (banner) {
    const cls = banner.tone === 'warn' ? 'tone-warn' : banner.tone === 'good' ? 'tone-good' : banner.tone === 'alert' ? 'tone-alert' : ''
    $('live-banner').innerHTML =
      '<div class="live-toast ' + cls + '">' +
        '<div class="live-toast-content">' + iconForTone(banner.tone === 'accent' ? 'good' : banner.tone) + '<span>' + esc(banner.text) + '</span></div>' +
        '<button type="button" class="live-toast-dismiss" id="dismiss-toast">Tutup</button>' +
      '</div>'
    $('dismiss-toast').onclick = () => { banner = null; render(false) }
  } else {
    $('live-banner').innerHTML = ''
  }

  const active = getActiveProposal()
  renderSwitcher(active)
  renderBuilder()
  renderActiveWorkspace(active, focusPanel)
}

$('btn-toggle-create').onclick = () => {
  showCreateForm = !showCreateForm
  formErrors = []
  render(false)
  if (showCreateForm && $('f-title')) $('f-title').focus()
}

$('btn-clear-all').onclick = () => {
  store = { version: 1, activeId: null, proposals: [] }
  saveStore()
  draftForm = createDefaultDraft()
  showCreateForm = true
  screen = 'board'
  banner = { text: 'Seluruh data usulan lokal telah dibersihkan.', tone: 'warn' }
  render(false)
}

window.addEventListener('hashchange', () => {
  tryImportFromHash()
  render(false)
})

tryImportFromHash()
render(false)
</script>
</body>
</html>
