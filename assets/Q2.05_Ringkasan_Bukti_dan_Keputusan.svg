<text x="360" y="626" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Board</text>
<text x="105" y="722" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14283F">K1</text>
<rect x="195" y="680" width="546" height="35" rx="5" fill="#355AA8"/>
<text x="751" y="702" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#355AA8">78</text>
<rect x="195" y="725" width="294" height="35" rx="5" fill="#137D83"/>
<text x="499" y="747" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#137D83">42</text>
<text x="105" y="842" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14283F">K2</text>
<rect x="195" y="800" width="525" height="35" rx="5" fill="#355AA8"/>
<text x="730" y="822" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#355AA8">75</text>
<rect x="195" y="845" width="280" height="35" rx="5" fill="#137D83"/>
<text x="485" y="867" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#137D83">40</text>
<text x="105" y="962" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14283F">K3</text>
<rect x="195" y="920" width="504" height="35" rx="5" fill="#355AA8"/>
<text x="709" y="942" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#355AA8">72</text>
<rect x="195" y="965" width="266" height="35" rx="5" fill="#137D83"/>
<text x="471" y="987" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#137D83">38</text>
<text x="105" y="1061" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#52637A">Satuan: detik · Pengukuran mandiri, belum diverifikasi</text>
<rect x="1020" y="510" width="710" height="570" rx="20" fill="#FFFFFF"/>
<text x="1050" y="565" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#98631E">VERDICT</text>
<text x="1050" y="643" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#14283F">Inconclusive</text>
<text x="1050" y="711" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#14283F">Ambang tercapai secara indikatif. Bukti</text>
<text x="1050" y="746.0" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#14283F">pelaksanaan belum cukup untuk validasi</text>
<text x="1050" y="781.0" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#14283F">memadai.</text>
<text x="1050" y="858" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#137D83">KEPUTUSAN SAYA</text>
<text x="1050" y="927" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#14283F">Validasi tambahan sebelum MVP</text>
<text x="75" y="1148" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#14283F">Pertahankan ambang H1. Dokumentasikan uji ulang dan periksa pembaruan status secara terpisah.</text>
<text x="72" y="1216" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#52637A">Sumber: Q2.04 revisi §4.2, §5.3 dan §6; evaluasi Q2.05. Selisih waktu ini tidak mengukur penghematan keseluruhan koordinasi atau membuktikan</text>
<text x="72" y="1242.25" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#52637A">peningkatan akurasi.</text>
