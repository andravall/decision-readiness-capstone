<text x="98" y="345" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#14283F">3/3 benar</text>
<text x="98" y="405" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14283F">Chat dan board memiliki ketepatan</text>
<text x="98" y="436.25" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14283F">sama.</text>
<rect x="640" y="230" width="520" height="230" rx="20" fill="#FFFFFF"/>
<text x="668" y="277" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#355AA8">DURASI RATA-RATA</text>
<text x="668" y="345" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#14283F">75 → 40 detik</text>
<text x="668" y="405" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14283F">Selisih 35 detik pada laporan</text>
<text x="668" y="436.25" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14283F">K1–K3.</text>
<rect x="1210" y="230" width="520" height="230" rx="20" fill="#FFFFFF"/>
<text x="1238" y="277" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#98631E">KEKUATAN BUKTI</text>
<text x="1238" y="345" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#14283F">Masih terbatas</text>
<text x="1238" y="405" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14283F">Dokumentasi asal dan prosedur</text>
<text x="1238" y="436.25" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14283F">belum memadai.</text>
