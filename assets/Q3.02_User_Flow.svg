<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="uf-title uf-desc">
  <title id="uf-title">Diagram Alur Q3.02 — Keputusan Koordinator Menetapkan Jadwal Kelompok</title>
  <desc id="uf-desc">Alur formal dimulai dari pembuatan satu usulan waktu, pencatatan respons terakhir di board, pemeriksaan kesiapan, dan gerbang keputusan kecukupan informasi. Jika belum cukup, jadwal ditandai sementara untuk klarifikasi via WhatsApp lalu kembali ke pencatatan respons. Jika cukup, koordinator menetapkan status final beserta alasan dan mengumumkan jadwal di WhatsApp hingga selesai, disertai jalur peninjauan ulang apabila respons berubah sesudah final.</desc>

  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#141714" fill-opacity="0.055"/>
    </pattern>

    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141714" flood-opacity="0.045"/>
    </filter>

    <marker id="arrow-ink" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 2 2.2 L 10 6 L 2 9.8" fill="none" stroke="#3A4039" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <marker id="arrow-warn" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 2 2.2 L 10 6 L 2 9.8" fill="none" stroke="#9A5B13" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <marker id="arrow-good" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 2 2.2 L 10 6 L 2 9.8" fill="none" stroke="#135C3B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <marker id="arrow-alert" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 2 2.2 L 10 6 L 2 9.8" fill="none" stroke="#992828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <clipPath id="sheet-clip">
      <rect x="28" y="28" width="1544" height="1244" rx="16"/>
    </clipPath>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif; }
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Charter, Georgia, serif; }
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
      .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.11em; fill: #6E756B; }
      .h1 { font-size: 35px; font-weight: 400; letter-spacing: -0.02em; fill: #141714; }
      .subtitle { font-size: 15px; fill: #484E46; }
      .node-title { font-size: 18px; font-weight: 650; fill: #141714; letter-spacing: -0.015em; }
      .node-desc { font-size: 13.8px; fill: #484E46; }
      .step-num { font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; }
      .chan-tag { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; fill: #52584F; }
      .connector { fill: none; stroke: #3A4039; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-ink); }
      .connector-warn { fill: none; stroke: #9A5B13; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-warn); }
      .connector-good { fill: none; stroke: #135C3B; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-good); }
      .connector-alert { fill: none; stroke: #992828; stroke-width: 1.8; stroke-dasharray: 6 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-alert); }
    </style>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1600" height="1300" fill="#EAE8DF"/>

  <!-- Main Architectural Sheet -->
  <g clip-path="url(#sheet-clip)">
    <rect x="28" y="28" width="1544" height="1244" fill="#FAF9F5"/>
    <rect x="28" y="28" width="1544" height="1244" fill="url(#dot-grid)"/>
    <rect x="28" y="28" width="1544" height="5" fill="#1B44C8"/>
  </g>
  <rect x="28" y="28" width="1544" height="1244" rx="16" fill="none" stroke="#D5D5CA" stroke-width="1.5"/>

  <!-- Header Block -->
  <text x="72" y="82" class="mono eyebrow">Q3.02 · EXPERIENCE DESIGN BLUEPRINT · USER FLOW DIAGRAM</text>
  <text x="72" y="124" class="serif h1">Bagaimana saya menetapkan jadwal kelompok</text>
  <text x="72" y="154" class="sans subtitle">Tujuan: satu waktu pertemuan dapat ditegaskan dengan alasan yang jelas dan statusnya dipahami anggota.</text>

  <!-- Notation Legend Box -->
  <g filter="url(#card-shadow)">
    <rect x="1124" y="60" width="404" height="104" rx="10" fill="#FFFFFF" stroke="#DDDDD3" stroke-width="1.2"/>
  </g>
  <text x="1144" y="83" class="mono" font-size="10.5" font-weight="600" letter-spacing="0.09em" fill="#6E756B">LEGENDA NOTASI ALUR</text>

  <ellipse cx="1164" cy="108" rx="18" ry="8.5" fill="#141714"/>
  <text x="1192" y="112" class="sans" font-size="12.5" fill="#484E46">Awal / Selesai</text>

  <rect x="1322" y="99.5" width="32" height="17" rx="4" fill="#FFFFFF" stroke="#1B44C8" stroke-width="1.5"/>
  <text x="1364" y="112" class="sans" font-size="12.5" fill="#484E46">Tindakan proses</text>

  <polygon points="1164,129 1182,139 1164,149 1146,139" fill="#FEF6E4" stroke="#B76E14" stroke-width="1.5"/>
  <text x="1192" y="143" class="sans" font-size="12.5" fill="#484E46">Keputusan aturan</text>

  <line x1="1322" y1="139" x2="1354" y2="139" stroke="#992828" stroke-width="1.8" stroke-dasharray="4 3" stroke-linecap="round"/>
  <text x="1364" y="143" class="sans" font-size="12.5" fill="#484E46">Tinjau ulang pasca-final</text>

  <!-- Header Divider -->
  <line x1="72" y1="184" x2="1528" y2="184" stroke="#E2E2D8" stroke-width="1.2"/>

  <!-- ================= CENTER SPINE (cx = 800) ================= -->

  <!-- Start Terminal (Oval) -->
  <g filter="url(#card-shadow)">
    <ellipse cx="800" cy="232" rx="94" ry="25" fill="#141714" stroke="#141714" stroke-width="1.5"/>
  </g>
  <text x="800" y="237" text-anchor="middle" class="mono" font-size="13" font-weight="700" letter-spacing="0.14em" fill="#FFFFFF">MULAI</text>

  <path class="connector" d="M 800 257 L 800 300"/>

  <!-- Step 01 -->
  <g filter="url(#card-shadow)">
    <rect x="500" y="306" width="600" height="94" rx="10" fill="#FFFFFF" stroke="#CFCFC3" stroke-width="1.4"/>
    <rect x="500" y="318" width="4" height="70" rx="2" fill="#1B44C8"/>
  </g>
  <rect x="522" y="324" width="38" height="22" rx="5" fill="#EEF2FD" stroke="#C5D3F8" stroke-width="1"/>
  <text x="541" y="339" text-anchor="middle" class="mono step-num" fill="#1B44C8">01</text>
  <text x="572" y="341" class="sans node-title">Buat satu usulan waktu</text>
  <rect x="1012" y="324" width="68" height="22" rx="5" fill="#F5F4EE" stroke="#DDDDD3" stroke-width="1"/>
  <text x="1046" y="339" text-anchor="middle" class="mono chan-tag">BOARD</text>
  <text x="572" y="372" class="sans node-desc">Tentukan kandidat jadwal pertemuan dan tandai siapa yang wajib hadir</text>

  <path class="connector" d="M 800 400 L 800 442"/>

  <!-- Step 02 (Central Synchronization Node) -->
  <g filter="url(#card-shadow)">
    <rect x="500" y="448" width="600" height="94" rx="10" fill="#FFFFFF" stroke="#1B44C8" stroke-width="1.8"/>
    <rect x="500" y="460" width="4" height="70" rx="2" fill="#1B44C8"/>
  </g>
  <rect x="522" y="466" width="38" height="22" rx="5" fill="#EEF2FD" stroke="#C5D3F8" stroke-width="1"/>
  <text x="541" y="481" text-anchor="middle" class="mono step-num" fill="#1B44C8">02</text>
  <text x="572" y="483" class="sans node-title">Catat respons terakhir di board</text>
  <rect x="1012" y="466" width="68" height="22" rx="5" fill="#EEF2FD" stroke="#C5D3F8" stroke-width="1"/>
  <text x="1046" y="481" text-anchor="middle" class="mono chan-tag" fill="#1B44C8">BOARD</text>
  <text x="572" y="514" class="sans node-desc">Tampilkan status tertulis, tingkat kepastian, dan penanda waktu pembaruan</text>

  <path class="connector" d="M 800 542 L 800 584"/>

  <!-- Step 03 -->
  <g filter="url(#card-shadow)">
    <rect x="500" y="590" width="600" height="94" rx="10" fill="#FFFFFF" stroke="#CFCFC3" stroke-width="1.4"/>
    <rect x="500" y="602" width="4" height="70" rx="2" fill="#1B44C8"/>
  </g>
  <rect x="522" y="608" width="38" height="22" rx="5" fill="#EEF2FD" stroke="#C5D3F8" stroke-width="1"/>
  <text x="541" y="623" text-anchor="middle" class="mono step-num" fill="#1B44C8">03</text>
  <text x="572" y="625" class="sans node-title">Periksa kesiapan keputusan</text>
  <rect x="980" y="608" width="100" height="22" rx="5" fill="#F5F4EE" stroke="#DDDDD3" stroke-width="1"/>
  <text x="1030" y="623" text-anchor="middle" class="mono chan-tag">DIAGNOSTIK</text>
  <text x="572" y="656" class="sans node-desc">Temukan anggota wajib yang belum menjawab, masih tentatif, atau berubah</text>

  <path class="connector" d="M 800 684 L 800 724"/>

  <!-- Decision Gate (Diamond) -->
  <g filter="url(#card-shadow)">
    <polygon points="800,730 998,808 800,886 602,808" fill="#FEF8E8" stroke="#C6881E" stroke-width="2"/>
  </g>
  <text x="800" y="786" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" letter-spacing="0.09em" fill="#824B0A">ATURAN KONFIRMASI</text>
  <text x="800" y="811" text-anchor="middle" class="sans" font-size="17.5" font-weight="650" fill="#141714">Informasi penting</text>
  <text x="800" y="834" text-anchor="middle" class="sans" font-size="17.5" font-weight="650" fill="#141714">sudah cukup?</text>

  <!-- ================= LEFT BRANCH: BELUM CUKUP ================= -->

  <path class="connector-warn" d="M 602 808 H 374 Q 360 808 360 822 V 910"/>

  <!-- Branch Badge: BELUM -->
  <rect x="434" y="794" width="104" height="28" rx="14" fill="#FEF6E4" stroke="#E5C17B" stroke-width="1.5"/>
  <text x="486" y="812" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" letter-spacing="0.06em" fill="#824B0A">BELUM</text>

  <!-- Step 04a -->
  <g filter="url(#card-shadow)">
    <rect x="110" y="916" width="500" height="116" rx="10" fill="#FFFDF8" stroke="#DFB864" stroke-width="1.7"/>
    <rect x="110" y="928" width="4" height="92" rx="2" fill="#B76E14"/>
  </g>
  <rect x="132" y="934" width="46" height="22" rx="5" fill="#FEF6E4" stroke="#EFD393" stroke-width="1"/>
  <text x="155" y="949" text-anchor="middle" class="mono step-num" fill="#824B0A">04a</text>
  <text x="190" y="951" class="sans node-title">Tandai status Sementara</text>
  <rect x="444" y="934" width="146" height="22" rx="5" fill="#FEF6E4" stroke="#EFD393" stroke-width="1"/>
  <text x="517" y="949" text-anchor="middle" class="mono chan-tag" fill="#824B0A">BOARD + WHATSAPP</text>
  <text x="190" y="982" class="sans node-desc">Minta klarifikasi ke anggota wajib lewat WhatsApp</text>
  <text x="190" y="1004" class="sans node-desc">tanpa memberi kesan jadwal sudah pasti</text>

  <!-- Return Loop 04a -> Step 02 -->
  <path class="connector-warn" d="M 110 974 H 82 Q 68 974 68 960 V 509 Q 68 495 82 495 H 494"/>
  <rect x="138" y="481" width="286" height="28" rx="14" fill="#FEF6E4" stroke="#E5C17B" stroke-width="1.4"/>
  <text x="281" y="499" text-anchor="middle" class="mono" font-size="11" font-weight="700" letter-spacing="0.05em" fill="#824B0A">ULANGI SETELAH ADA JAWABAN</text>

  <!-- ================= RIGHT BRANCH: CUKUP ================= -->

  <path class="connector-good" d="M 998 808 H 1196 Q 1210 808 1210 822 V 894"/>

  <!-- Branch Badge: CUKUP -->
  <rect x="1050" y="794" width="104" height="28" rx="14" fill="#EAF6EF" stroke="#A6D8BD" stroke-width="1.5"/>
  <text x="1102" y="812" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" letter-spacing="0.06em" fill="#135C3B">CUKUP</text>

  <!-- Step 04b -->
  <g filter="url(#card-shadow)">
    <rect x="970" y="900" width="480" height="112" rx="10" fill="#F7FCF9" stroke="#8EC9A8" stroke-width="1.7"/>
    <rect x="970" y="912" width="4" height="88" rx="2" fill="#135C3B"/>
  </g>
  <rect x="992" y="918" width="46" height="22" rx="5" fill="#EAF6EF" stroke="#B7DFC8" stroke-width="1"/>
  <text x="1015" y="933" text-anchor="middle" class="mono step-num" fill="#135C3B">04b</text>
  <text x="1050" y="935" class="sans node-title">Tetapkan status Final</text>
  <rect x="1282" y="918" width="148" height="22" rx="5" fill="#EAF6EF" stroke="#B7DFC8" stroke-width="1"/>
  <text x="1356" y="933" text-anchor="middle" class="mono chan-tag" fill="#135C3B">AKSI KOORDINATOR</text>
  <text x="1050" y="966" class="sans node-desc">Pastikan aturan kelompok terpenuhi dan catat</text>
  <text x="1050" y="988" class="sans node-desc">alasan keputusan secara sadar (bukan otomatis)</text>

  <path class="connector-good" d="M 1210 1012 L 1210 1050"/>

  <!-- Step 05 -->
  <g filter="url(#card-shadow)">
    <rect x="970" y="1056" width="480" height="94" rx="10" fill="#FFFFFF" stroke="#CFCFC3" stroke-width="1.4"/>
    <rect x="970" y="1068" width="4" height="70" rx="2" fill="#135C3B"/>
  </g>
  <rect x="992" y="1074" width="38" height="22" rx="5" fill="#EAF6EF" stroke="#B7DFC8" stroke-width="1"/>
  <text x="1011" y="1089" text-anchor="middle" class="mono step-num" fill="#135C3B">05</text>
  <text x="1042" y="1091" class="sans node-title">Umumkan jadwal final</text>
  <rect x="1340" y="1074" width="90" height="22" rx="5" fill="#F5F4EE" stroke="#DDDDD3" stroke-width="1"/>
  <text x="1385" y="1089" text-anchor="middle" class="mono chan-tag">WHATSAPP</text>
  <text x="1042" y="1122" class="sans node-desc">Bagikan waktu final beserta dasar keputusannya ke grup</text>

  <path class="connector-good" d="M 1210 1150 L 1210 1188"/>

  <!-- End Terminal (Oval) -->
  <g filter="url(#card-shadow)">
    <ellipse cx="1210" cy="1218" rx="102" ry="25" fill="#EAF6EF" stroke="#135C3B" stroke-width="1.8"/>
  </g>
  <text x="1210" y="1223" text-anchor="middle" class="mono" font-size="13" font-weight="700" letter-spacing="0.14em" fill="#135C3B">SELESAI</text>

  <!-- Post-Final Drift Loop (Right Rail -> Step 02) -->
  <path class="connector-alert" d="M 1450 1103 H 1512 Q 1526 1103 1526 1089 V 509 Q 1526 495 1512 495 H 1106"/>
  <rect x="1156" y="481" width="318" height="28" rx="14" fill="#FDF0EE" stroke="#EFC1BC" stroke-width="1.4"/>
  <text x="1315" y="499" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" letter-spacing="0.04em" fill="#992828">JIKA BERUBAH PASCA-FINAL → TINJAU ULANG</text>

  <!-- Protocol Principles Callout Box (Bottom-Left) -->
  <g filter="url(#card-shadow)">
    <rect x="120" y="1090" width="744" height="152" rx="10" fill="#F5F4EE" stroke="#DDDDD3" stroke-width="1.3"/>
    <rect x="120" y="1104" width="4" height="124" rx="2" fill="#1B44C8"/>
  </g>
  <text x="144" y="1118" class="mono" font-size="11" font-weight="700" letter-spacing="0.09em" fill="#1B44C8">PRINSIP CONFIRMATION PROTOCOL PADA ALUR INI</text>
  <text x="144" y="1148" class="sans" font-size="13.5" fill="#141714">• Keputusan dibuat secara sadar oleh koordinator, bukan ditetapkan otomatis oleh board.</text>
  <text x="144" y="1178" class="sans" font-size="13.5" fill="#141714">• Board membantu membaca kesiapan respons; WhatsApp tetap menjadi kanal klarifikasi dan pengumuman.</text>
  <text x="144" y="1208" class="sans" font-size="13.5" fill="#141714">• Perubahan respons sesudah status Final membuka peninjauan ulang tanpa menghapus riwayat sebelumnya.</text>
</svg>
