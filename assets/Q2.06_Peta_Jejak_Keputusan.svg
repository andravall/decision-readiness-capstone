<text x="75" y="1186" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#14283F">Masalah → pilihan → taruhan → bukti → keputusan → pengujian berikutnya</text>
<text x="72" y="1236" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#52637A">Sumber: portofolio Q1.03–Q1.06 dan Q2.02–Q2.05. Angka K1–K3 adalah laporan peserta; visual ini merupakan sintesis dokumen, bukan bukti pengujian</text>
<text x="72" y="1262.25" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#52637A">baru.</text>
