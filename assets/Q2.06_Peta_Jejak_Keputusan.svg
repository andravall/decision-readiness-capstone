<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
<title>Q2.06 | Lean Evidence Trail</title>
<rect x="0" y="0" width="1800" height="1320" rx="0" fill="#F5F7FA"/>
<text x="70" y="91" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#14283F">Q2.06 | Lean Evidence Trail</text>
<text x="72" y="150" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#52637A">Mohammad Ferdinand Valliandra · 5026231159 · Part B · Decision Readiness Board</text>
<rect x="70" y="230" width="520" height="410" rx="20" fill="#FFFFFF"/>
<rect x="70" y="230" width="520" height="8" rx="0" fill="#137D83"/>
<text x="98" y="280" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#137D83">01 · QUEST 1</text>
<text x="98" y="344" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#14283F">Masalah pengguna</text>
<text x="98" y="432" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Kapan respons anggota cukup untuk</text>
<text x="98" y="462.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">menetapkan jadwal?</text>
<text x="98" y="492.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Tindak lanjut terlihat; dampak umum</text>
<text x="98" y="522.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">pada pengerjaan belum terukur.</text>
<rect x="640" y="230" width="520" height="410" rx="20" fill="#FFFFFF"/>
<rect x="640" y="230" width="520" height="8" rx="0" fill="#137D83"/>
<text x="668" y="280" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#137D83">02 · Q2.02</text>
<text x="668" y="344" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#14283F">Alternatif solusi</text>
<text x="668" y="432" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Enam alternatif dibandingkan. Board</text>
<text x="668" y="462.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">dipilih sebagai kandidat digital;</text>
<text x="668" y="492.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">protokol menjadi aturan penggunaan.</text>
<text x="668" y="522.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Koreksi skor: board 17/20, protokol</text>
<text x="668" y="552.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">19/20.</text>
<rect x="1210" y="230" width="520" height="410" rx="20" fill="#FFFFFF"/>
<rect x="1210" y="230" width="520" height="8" rx="0" fill="#137D83"/>
<text x="1238" y="280" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#137D83">03 · Q2.03</text>
<text x="1238" y="344" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#14283F">Hipotesis H1 / A3</text>
<text x="1238" y="432" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Minimal 2/3 benar pada board tanpa</text>
<text x="1238" y="462.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">membuka chat. Pada ≥2 orang yang</text>
<text x="1238" y="492.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">benar, durasi board ≤ chat.</text>
<text x="1238" y="522.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Kedua syarat harus terpenuhi.</text>
<rect x="1210" y="730" width="520" height="410" rx="20" fill="#FFFFFF"/>
<rect x="1210" y="730" width="520" height="8" rx="0" fill="#137D83"/>
<text x="1238" y="780" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#137D83">04 · Q2.04</text>
<text x="1238" y="844" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#14283F">Dua tahap bukti</text>
<text x="1238" y="932" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">R1–R3: pendapat dan daftar status.</text>
<text x="1238" y="962.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">K1–K3: ketepatan 3/3 pada kedua</text>
<text x="1238" y="992.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">kondisi; durasi rata-rata terlapor</text>
<text x="1238" y="1022.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">75 vs 40 detik. Bukti asal</text>
<text x="1238" y="1052.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">terbatas.</text>
<rect x="640" y="730" width="520" height="410" rx="20" fill="#FFFFFF"/>
<rect x="640" y="730" width="520" height="8" rx="0" fill="#98631E"/>
<text x="668" y="780" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#98631E">05 · Q2.05</text>
<text x="668" y="844" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#14283F">Verdict dan keputusan</text>
<text x="668" y="932" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">H1: Inconclusive untuk validasi</text>
<text x="668" y="962.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">memadai. Angka mendukung secara</text>
<text x="668" y="992.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">indikatif; prosedur belum cukup</text>
<text x="668" y="1022.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">dapat ditelusuri.</text>
<text x="668" y="1052.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Validasi tambahan sebelum MVP.</text>
<rect x="70" y="730" width="520" height="410" rx="20" fill="#FFFFFF"/>
<rect x="70" y="730" width="520" height="8" rx="0" fill="#355AA8"/>
<text x="98" y="780" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#355AA8">06 · LANGKAH BERIKUTNYA</text>
<text x="98" y="844" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#14283F">Uji dan dokumentasikan</text>
<text x="98" y="932" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Ulangi H1 dengan catatan instrumen,</text>
<text x="98" y="962.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">jawaban, bantuan, dan waktu.</text>
<text x="98" y="992.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Uji pembaruan status secara</text>
<text x="98" y="1022.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">terpisah. Board tetap kandidat.</text>
