<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
<title>Q2.07 | My Innovation Mindshift</title>
<rect x="0" y="0" width="1800" height="1320" rx="0" fill="#F5F7FA"/>
<text x="70" y="91" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#14283F">Q2.07 | My Innovation Mindshift</text>
<text x="72" y="150" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#52637A">Mohammad Ferdinand Valliandra · 5026231159 · From Assumption to Insight</text>
<rect x="70" y="230" width="520" height="410" rx="20" fill="#FFFFFF"/>
<rect x="70" y="230" width="520" height="8" rx="0" fill="#137D83"/>
<text x="98" y="280" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#137D83">01 · STARTING BELIEF</text>
<text x="98" y="344" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#14283F">Tampilan terstruktur</text>
<text x="98" y="432" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Saya menduga board memberi nilai</text>
<text x="98" y="462.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">tambahan karena respons dan</text>
<text x="98" y="492.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">kepastian terlihat bersama.</text>
<text x="98" y="522.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Dugaan desain ini perlu diuji.</text>
<rect x="640" y="230" width="520" height="410" rx="20" fill="#FFFFFF"/>
<rect x="640" y="230" width="520" height="8" rx="0" fill="#137D83"/>
<text x="668" y="280" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#137D83">02 · TURNING POINT</text>
<text x="668" y="344" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#14283F">Apakah datanya cukup?</text>
<text x="668" y="432" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Tanggapan awal tidak mengukur</text>
<text x="668" y="462.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">perbandingan H1. Laporan lanjutan</text>
<text x="668" y="492.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">memberi angka positif, tetapi</text>
<text x="668" y="522.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">dokumentasi asal terbatas.</text>
<rect x="1210" y="230" width="520" height="410" rx="20" fill="#FFFFFF"/>
<rect x="1210" y="230" width="520" height="8" rx="0" fill="#137D83"/>
<text x="1238" y="280" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#137D83">03 · QUESTION</text>
<text x="1238" y="344" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#14283F">Periksa asumsi saya</text>
<text x="1238" y="432" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Pendapat konsep, jawaban tugas, dan</text>
<text x="1238" y="462.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">bukti pelaksanaan memiliki fungsi</text>
<text x="1238" y="492.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">berbeda.</text>
<text x="1238" y="522.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Apa pengaruh skenario, urutan,</text>
<text x="1238" y="552.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">bantuan, dan stopwatch?</text>
<rect x="70" y="730" width="520" height="410" rx="20" fill="#FFFFFF"/>
<rect x="70" y="730" width="520" height="8" rx="0" fill="#355AA8"/>
<text x="98" y="780" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#355AA8">04 · PERSPECTIVE SHIFT</text>
<text x="98" y="844" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#14283F">Angka dan kekuatan bukti</text>
<text x="98" y="932" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Saya membaca pencapaian target</text>
<text x="98" y="962.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">bersama prosedur dan</text>
<text x="98" y="992.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">keterlacakannya. Manfaat membaca</text>
<text x="98" y="1022.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">perlu dinilai bersama biaya</text>
<text x="98" y="1052.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">pembaruan.</text>
<rect x="640" y="730" width="520" height="410" rx="20" fill="#FFFFFF"/>
<rect x="640" y="730" width="520" height="8" rx="0" fill="#355AA8"/>
<text x="668" y="780" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#355AA8">05 · EVIDENCE</text>
<text x="668" y="844" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#14283F">Jejak yang dapat diperiksa</text>
<text x="668" y="932" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Q2.03: ambang H1.</text>
<text x="668" y="962.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Q2.04: dua tahap data dan</text>
<text x="668" y="992.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">keterbatasan.</text>
<text x="668" y="1022.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Q2.05: verdict dan keputusan.</text>
<text x="668" y="1052.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Q2.06: hubungan antartahap.</text>
<rect x="1210" y="730" width="520" height="410" rx="20" fill="#FFFFFF"/>
<rect x="1210" y="730" width="520" height="8" rx="0" fill="#355AA8"/>
<text x="1238" y="780" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#355AA8">06 · NEXT PRINCIPLE</text>
<text x="1238" y="844" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#14283F">Uji sebelum membangun</text>
<text x="1238" y="932" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">Saya akan memeriksa kesesuaian</text>
<text x="1238" y="962.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">tugas dan menyimpan bukti asal</text>
<text x="1238" y="992.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">sebelum memakai hasil sebagai dasar</text>
<text x="1238" y="1022.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283F">pengembangan.</text>
