<text x="75" y="1187" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14283F">Keputusan saya: validasi tambahan sebelum MVP; board tetap menjadi kandidat.</text>
<text x="72" y="1236" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#52637A">Sumber: refleksi Q2.07 dan portofolio Q2.02–Q2.06 Part B. Visual merangkum pemeriksaan bukti; tidak menambahkan pengalaman, dialog, atau</text>
