<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11192C"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="rim" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="arc" x1="12" y1="14" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="gem" x1="41" y1="14" x2="50" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Subtle Inner Telemetry Track -->
  <circle cx="32" cy="32" r="20" stroke="#1E293B" stroke-width="5.2"/>

  <!-- 300-Degree Swept Readiness & Schedule Dial Arc -->
  <path
    d="M37.2 12.7A20 20 0 1 0 51.3 26.8"
    stroke="url(#arc)"
    stroke-width="5.2"
    stroke-linecap="round"
  />

  <!-- Synchronized Check-Hands (Time Alignment + Confirmation Lock) -->
  <path
    d="M22.2 33.2L29.2 40.2L41.8 25.6"
    stroke="#F8FAFC"
    stroke-width="5.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Luminous Emerald Readiness Threshold Node -->
  <circle cx="46.1" cy="17.9" r="5.2" fill="url(#gem)" stroke="#090D18" stroke-width="2"/>
</svg>
